sections: [hero, cards, cta]

hero:
  align: center
  eyebrow: MapLibre style tooling
  title_lines:
    - words: [{ text: Inspect styles. }]
    - words: [{ text: Change them with confidence. }]
  lead: Five bounded style operations, defined once — callable from AI SDK, MCP, WebMCP, or the CLI.
  actions:
    - { label: Read the docs, url: docs/, icon: fa-solid fa-book, style: primary }
    - { label: View on GitHub, url: https://github.com/mapseekai/maplibre-style-tools, icon: fa-brands fa-github, style: ghost }

cards:
  eyebrow: Choose a path
  title: Start where you are
  columns: 3
  items:
    - title: New to the package?
      desc: What it does, how it is organized, and the five capabilities every interface shares.
      icon: fa-solid fa-diagram-project
      url: docs/introduction/
    - title: Ready to integrate?
      desc: Install it, then follow the AI SDK or CLI quick start to your first result.
      icon: fa-solid fa-rocket
      url: docs/getting-started/
    - title: Picking an interface?
      desc: Core, MapLibre, AI SDK, MCP, WebMCP, bridge, and CLI — one guide each.
      icon: fa-solid fa-code-branch
      url: docs/guides/

cta:
  title: Need exact numbers?
  text: Entry points, capability contracts, CLI options, error codes, and every enforced limit.
  label: Open the reference
  url: docs/reference/
