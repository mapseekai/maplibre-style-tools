sections: [hero, cards, cta]

hero:
  align: center
  eyebrow: MapLibre style tooling
  title_lines:
    - words: [{ text: Let AI agents inspect and edit }]
    - words: [{ text: MapLibre styles safely. }]
  lead: Five operations for reading and modifying MapLibre styles, available over AI SDK, MCP, WebMCP, and the CLI. Inputs are validated, edits are atomic, and results are bounded.
  actions:
    - { label: Read the docs, url: docs/, icon: fa-solid fa-book, style: primary }
    - { label: View on GitHub, url: https://github.com/mapseekai/maplibre-style-tools, icon: fa-brands fa-github, style: ghost }

cards:
  eyebrow: Documentation
  title: Choose a path
  columns: 3
  items:
    - title: Overview
      desc: The purpose of the package, its architecture, and the five capabilities every interface shares.
      icon: fa-solid fa-diagram-project
      url: docs/introduction/
    - title: Get started
      desc: Install the package and complete a first integration with the AI SDK or CLI quick start.
      icon: fa-solid fa-rocket
      url: docs/getting-started/
    - title: Choose an interface
      desc: Whether the agent runs in your process, in a browser page, or behind an MCP host, each entry point has its own guide.
      icon: fa-solid fa-code-branch
      url: docs/guides/

cta:
  title: Reference
  text: Entry points, capability contracts, CLI options, error codes, and every enforced limit.
  label: Open the reference
  url: docs/reference/
  style: primary
