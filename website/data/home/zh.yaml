sections: [hero, cards, cta]

hero:
  align: center
  eyebrow: MapLibre 样式工具
  title_lines:
    - words: [{ text: 把地图交给 Agent。 }]
    - words: [{ text: 样式始终安全。 }]
  lead: 五个工具，让 AI Agent 谨慎地读取和修改 MapLibre 样式。同一套操作，AI SDK、MCP、WebMCP、CLI 通用。
