title: &siteTitle maplibre-style-tools
baseURL: https://mapseekai.github.io/maplibre-style-tools/
defaultContentLanguage: en
enableGitInfo: true
enableRobotsTXT: true
enableEmoji: true
timeZone: UTC

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: *siteTitle
    params:
      description: AI-driven tools for inspecting and editing MapLibre styles.
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: *siteTitle
    hasCJKLanguage: true
    params:
      description: 用于检查和编辑 MapLibre 样式的 AI 驱动工具。

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS, NAVJSON]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  offline_search: true
  copyright:
    authors: maplibre-style-tools contributors
    from_year: 2026
  footer_center_info: ''
  github_repo: https://github.com/mapseekai/maplibre-style-tools
  github_branch: main
  logo: icons/logo.svg
  ui:
    dark_mode: true
    section_index: cards
    sidebar_menu_foldable: true
    sidebar_icon_policy: groups
    backlinks: true

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1
