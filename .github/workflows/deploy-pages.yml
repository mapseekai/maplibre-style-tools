name: deploy-pages

on:
  pull_request:
    paths:
      - website/**
      - examples/webmcp/**
      - src/**
      - scripts/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/deploy-pages.yml
  push:
    branches: [main]
    paths:
      - website/**
      - examples/webmcp/**
      - src/**
      - scripts/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.165.0
  GOWORK: off
  HUGO_MODULE_WORKSPACE: off
  HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install package dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Build WebMCP example
        run: pnpm run build:example:webmcp
        env:
          WEBMCP_BASE: /maplibre-style-tools/webmcp/

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: website/go.mod
          cache-dependency-path: website/go.sum

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo Extended
        run: |
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"

      - name: Download Oink
        working-directory: website
        run: go mod download github.com/pgsty/oink

      - name: Build documentation
        working-directory: website
        run: |
          hugo --cleanDestinationDir --gc --minify --environment production \
            --printPathWarnings --panicOnWarning \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Assemble Pages artifact
        run: |
          rm -rf .tmp/pages
          mkdir -p .tmp/pages
          cp -R website/public/. .tmp/pages/
          mkdir -p .tmp/pages/webmcp
          cp -R examples/webmcp/dist/. .tmp/pages/webmcp/

      - name: Verify Pages entry points
        run: |
          test -f .tmp/pages/index.html
          test -f .tmp/pages/zh/index.html
          test -f .tmp/pages/llms.txt
          test -f .tmp/pages/navigation.json
          test -f .tmp/pages/webmcp/index.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .tmp/pages

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
