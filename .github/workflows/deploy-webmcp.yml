name: deploy-webmcp

on:
  push:
    branches: [main]
    paths:
      - examples/webmcp/**
      - src/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/deploy-webmcp.yml
  workflow_dispatch:

# Requires repo Settings → Pages → Source: GitHub Actions (one-time setup).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-webmcp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The example imports the library through its package self-reference
      # (./dist/*), so build the library before the example bundle.
      - run: pnpm run build
      - run: pnpm run build:example:webmcp
        env:
          WEBMCP_BASE: /maplibre-style-tools/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/webmcp/dist
      - id: deployment
        uses: actions/deploy-pages@v4
